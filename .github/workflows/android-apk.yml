name: Build Android APK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            frontend/android/gradle/wrapper/gradle-wrapper.properties
            frontend/android/build.gradle
            frontend/android/app/build.gradle
            frontend/android/variables.gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platforms;android-36 build-tools;35.0.0

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build web app
        run: npm run build
        working-directory: frontend

      - name: Sync web assets to Android
        run: npx cap sync android
        working-directory: frontend

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lifelog-diary-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
